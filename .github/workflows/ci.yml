name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    # Generated servers are emitted for either MCP SDK major, and the served-surface tests run
    # an emitted server in this environment, so each major needs its own job. `dev` installs
    # 2.x, the default target; the 1.x job replaces it afterwards, since one resolve cannot hold
    # both.
    strategy:
      fail-fast: false
      matrix:
        sdk: ['2', '1']
    name: verify (MCP SDK ${{ matrix.sdk }}.x)
    # A real Redis for the shared record of spent confirmations. Without REDIS_URL the tests fall
    # back to fakeredis, which is how they run on a machine without Redis.
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - if: matrix.sdk == '1'
        run: python -m pip install 'mcp>=1.2,<2'
      - run: python scripts/verify_repo.py
