[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-mcp-compiler"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
version = "0.6.0"
description = "Semantic and safe compilation of enterprise APIs into MCP tool surfaces"
readme = "README.md"
authors = [{name = "Subhadip Mitra", email = "contact@subhadipmitra.com"}]
keywords = ["mcp", "openapi", "wsdl", "soap", "llm", "agents", "api", "governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
  "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "typer>=0.12", "PyYAML>=6.0", "lxml>=5.2", "jsonschema>=4.22"]

[project.optional-dependencies]
# The model-backed evaluation driver imports the Anthropic SDK, and nothing else does. It is
# an extra so that installing the compiler does not drag in a client for a service the
# compiler never calls.
eval = ["anthropic>=0.40"]

# Decision: the lint and type checkers are pinned to exact versions. An
# unpinned `ruff>=0.5` silently changes which rules run when a new release lands, so the
# verification gate would mean something different on every machine. Upgrades are a
# deliberate, reviewed change.
dev = [
  "pytest>=8",
  # Included in `dev` as well as its own extra, deliberately. Without it mypy cannot resolve
  # the driver's import and skips checking that module, so the gate would mean one thing on a
  # machine that happens to have the SDK and another on a machine that does not.
  "anthropic>=0.40",
  # Required by `scripts/check_packaging.py`, which builds the distribution without
  # isolation so the gate needs no network. A 3.12 virtual environment has neither.
  "setuptools>=68",
  "wheel>=0.43",
  "ruff==0.16.2",
  "mypy==2.3.0",
  "types-PyYAML>=6.0.12",
  "types-jsonschema>=4.22",
  "lxml-stubs>=0.5.1",
]
# Building the documentation site. Kept out of `dev` so the verification gate never depends
# on a theme being installed.
# Capped below the next major of each: MkDocs 2.0 removes the plugin and theming
# systems with no migration path, so an unpinned build would break unannounced.
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]

[project.urls]
Homepage = "https://github.com/bassrehab/api-mcp-compiler"
Documentation = "https://api-mcp.subhadipmitra.com/"
Source = "https://github.com/bassrehab/api-mcp-compiler"
Issues = "https://github.com/bassrehab/api-mcp-compiler/issues"
Changelog = "https://github.com/bassrehab/api-mcp-compiler/blob/main/CHANGELOG.md"

[project.scripts]
api-mcp-compiler = "api_mcp_compiler.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

# Decision: the contract schemas are package data, not repository files. An installed
# distribution has to be able to validate the artifacts it produces, and a wheel that ships
# only the code cannot. `scripts/check_packaging.py` builds the wheel and proves it.
[tool.setuptools.package-data]
# `py.typed` is what makes the `Typing :: Typed` classifier true. Without it a consumer's
# type checker treats every symbol here as Any, so the classifier was a claim with nothing
# behind it. Found by the first downstream consumer, which is the only place it shows.
api_mcp_compiler = ["schemas/*.schema.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pinned explicitly so the gate does not change meaning when ruff's defaults change.
select = ["E", "W", "F", "I", "B", "C4", "SIM", "UP", "PTH", "RUF", "TRY"]
# Decision: TRY003 is disabled. Contract and ingestion failures must name
# the offending pointer, schema and value, and pushing those details into exception class
# definitions would make the diagnostics worse, not the code cleaner.
ignore = ["TRY003"]

[tool.ruff.lint.flake8-bugbear]
# Typer's declarative parameter API requires these calls in argument defaults.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
# Assertions are the point of a test module.
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
